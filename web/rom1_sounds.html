<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     ROM-1: your sounds on the FM-1. .sf2 files converted here, in the browser (web/rom1conv.js, the converter in
     WebAssembly), fitted to the room with the best quality that fits, then put on the FM-1 in one go: ROM-1's
     package with region A in it (web/rom1pkg.js) installed (web/fm1ota.js), then region B sent over USB
     (web/rom1dev.js). tools/make_pages.py inlines the scripts and the package's metadata. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROM-1 sounds</title>
<style>
  /* ROM-1's colours: a warm dark body, the LCD's amber backlight and its brown ink */
  :root { --bg: #17130f; --fg: #f2e6d0; --dim: #a89c88; --accent: #f0a63a; --ink: #321a06; --sheet: #241d16; --rule: #3a3026;
          --warn: #ff8a5c; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; font-weight: 300; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 20px; }
  h2 { font-size: 16px; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; margin: 36px 0 12px; padding-top: 8px; border-top: 1px solid var(--rule); }
  p { margin: 0 0 14px; }
  .small { color: var(--dim); font-size: 13px; }
  .lang { float: right; font-size: 13px; color: var(--dim); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; }
  button { font: inherit; background: var(--accent); color: var(--ink); border: 1px solid var(--accent); padding: 6px 18px; cursor: pointer; border-radius: 3px; }
  button.quiet { background: none; color: var(--fg); border-color: var(--rule); padding: 1px 9px; font-size: 13px; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .site { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1.2rem; margin: 0 0 1.6rem; padding-bottom: .5rem; border-bottom: 1px solid var(--rule); }
  .site .home { font-size: 1.05rem; letter-spacing: .08em; color: var(--fg); text-decoration: none; }
  .site nav { margin-left: auto; display: flex; flex-wrap: wrap; gap: .2rem 1rem; font-size: .92rem; }
  .site nav a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .site nav a[aria-current] { text-decoration: none; color: var(--accent); }
  .drop { border: 1px dashed var(--dim); border-radius: 6px; padding: 18px; text-align: center; color: var(--dim); margin: 0 0 16px; }
  .drop.over { border-color: var(--accent); color: var(--fg); }
  .drop input { display: block; margin: 8px auto 0; font: inherit; font-size: 13px; color: var(--dim); max-width: 100%; }
  .font { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin: 0 0 10px; }
  .font .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .font .num { font-variant-numeric: tabular-nums; background: var(--accent); color: var(--ink); border-radius: 3px; padding: 0 6px; font-size: 13px; }
  .font .nm { font-weight: 600; overflow-wrap: anywhere; }
  .font .tools { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  .font summary { cursor: pointer; color: var(--dim); font-size: 14px; margin-top: 4px; }
  .font ul { list-style: none; margin: 6px 0 0; padding: 0; columns: 2 16rem; column-gap: 18px; font-size: 14px; }
  .font li { break-inside: avoid; }
  .font li label { display: flex; gap: 6px; align-items: baseline; cursor: pointer; }
  .font li .bp { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 4.6em; }
  .font li .pn { flex: 1; overflow-wrap: anywhere; }
  .font li .kb { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .meter { margin: 18px 0; }
  .bar { position: relative; height: 22px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .15s; }
  .bar .fill.over { background: var(--warn); }
  .bar .cut { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bg); }
  .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 3px; }
  #fit { font-size: 15px; margin-top: 8px; }
  #fit.bad { color: var(--warn); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type=text] { font: inherit; background: var(--sheet); color: var(--fg); border: 1px solid var(--rule); border-radius: 3px; padding: 4px 8px; width: 16rem; max-width: 100%; }
  progress { width: 100%; height: 4px; margin-top: 12px; accent-color: #f0a63a; }
  #status { margin-top: 12px; min-height: 1.6em; }
  pre { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin-top: 12px; max-height: 14em; overflow: auto; }
  a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <header class="site"><a class="home" href="../">ROM-1</a><nav><a href="../emu/">Emulator</a><a href="../install/">Install</a><a href="../sounds/" aria-current="page">Your sounds</a><a href="../manual/">Manual</a></nav></header>
  <button class="lang" id="lang"></button>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
  <p class="small" data-t="room"></p>

  <div class="drop" id="drop"><span data-t="drop"></span><input type="file" id="files" accept=".sf2" multiple></div>
  <div id="fonts"></div>

  <div class="meter" id="meter" hidden>
    <div class="bar" role="img" id="barbox"><div class="fill" id="fill"></div><div class="cut" id="cut"></div></div>
    <div class="legend"><span data-t="infw"></span><span data-t="indata"></span></div>
    <p id="fit"></p>
    <p class="small" id="quality"></p>
  </div>

  <div id="make" hidden>
    <p class="row"><label for="name" data-t="name"></label> <input type="text" id="name" maxlength="31" value="My sounds">
      <button id="convert" data-t="convert"></button></p>
    <p class="row" id="after" hidden>
      <button id="put" data-t="put"></button>
      <button id="try" class="quiet" data-t="try"></button>
    </p>
  </div>
  <progress id="bar" max="100" value="0"></progress>
  <p id="status"></p>
  <pre id="log"></pre>

  <h2 data-t="notesh"></h2>
  <p class="small" data-t="note1"></p>
  <p class="small" data-t="note2"></p>
  <p class="small" data-t="note3"></p>
  <p class="small" data-t="beta"></p>
  <p class="small"><span data-t="license"></span> <a href="../source/" style="color:inherit">../source/</a>.
    M-VAVE and FM-1 are trademarks of their respective owners.</p>
</main>
<script type="module">
/*LIB*/
const $ = (id) => document.getElementById(id);
const ROOM_B = 0x45000;                          // region B: the data area (firmware/src/synth/r1bank.h R1_B_ROOM)
const TEXT = {

  ja: {
    title: "自分の音を FM-1 に", other: "English",
    intro: ".sf2 ファイルと使いたいプリセットを選んでください。このページがこのパソコンの中で変換し（サーバーには送りません）、入る範囲でいちばん良い音質に収めて、ROM-1 と一緒に USB で FM-1 に書き込みます。Chrome か Edge で使えます。",

    converting: "変換中", converted: "変換しました: ", ready: " FM-1 に書き込むか、先にエミュレーターで試せます。",

    stopped: "途中で止まりました。USB を挿し直してもう一度押してください。", error: "エラー: ",

    model: "接続されている機器は FM-1 ではありません。", lost: "USB の接続が切れました。挿し直してもう一度押してください。",
    noloader: "書き込みモードの FM-1 が見つかりません。USB を挿し直してもう一度押してください。",
    noreturn: "FM-1 が戻ってきません。電源を入れ直してください。", mismatch: "書き込みは終わりましたが、FM-1 が別のバージョンを報告しています: ",
    leave: "書き込み中です。ページを閉じないでください。",
    notesh: "知っておくこと",
    note1: "音はファームウェアの中に入ります。ROM-1 を入れ直す（アップデートや通常のインストール）とスターター音源に戻ります。自分の音を使い続けるには、このページからもう一度書き込んでください。",
    note2: "使ってよい音を使ってください。.sf2 のサンプルは作った人のもので、何ができるかはそのライセンス次第です。",
    note3: "途中で止まった場合、データ領域にある音のプリセットはもう一度書き込むまで鳴りません。それ以外は鳴ります。",
    beta: "このカスタムファームウェアを使ったことで FM-1 が壊れたり不具合が起きたりしても、作者は一切の責任を負いません。自己責任でお使いください。",
    license: "ROM-1 はフリーソフトウェア（GPL-3.0）、無保証です。ソース:",
  },
};
let lang = "en";
const t = (k) => TEXT[lang][k];
let lastKey = null, lastArg = "";
const sayK = (k, arg = "") => { lastKey = k; lastArg = arg; $("status").textContent = t(k) + arg; };
const say = (s) => { lastKey = null; $("status").textContent = s; };
const log = (s) => { $("log").textContent += s + "\n"; };
const kb = (n) => `${Math.round(n / 1024).toLocaleString()} KB`;
const mb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : kb(n));
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  $("lang").textContent = t("other");
  if (lastKey) $("status").textContent = t(lastKey) + lastArg;
  drawFonts();
  replan();
}
$("lang").addEventListener("click", () => { lang = lang === "ja" ? "en" : "ja"; applyLang(); });

const meta = /*META*/;
let pkg = null, info = null, cv = null, built = null, busy = false;
let fonts = [];                                   // [{file, name, presets: [{name, bank, prog, bytes, on}]}]

// ---- the converter: its fonts in the page's order; selections as the page has them
async function reload() {
  cv.reset();
  for (const f of fonts) {
    const k = await cv.addFont(f.file);
    f.presets.forEach((p, i) => cv.select(k, i, p.on));
  }
}
async function addFiles(list) {
  if (!(await started)) return;                   // (files chosen while the page starts wait for it)
  for (const file of list) {
    if (!/\.sf2$/i.test(file.name)) { log(t("badfont") + file.name); continue; }
    if (fonts.some((f) => f.file.name === file.name && f.file.size === file.size && f.file.lastModified === file.lastModified)) continue;
    try {
      const k = await cv.addFont(file);
      fonts.push({ file, name: cv.fontName(k), presets: cv.presets(k) });
    } catch (e) { log(t("badfont") + `${file.name}: ${e.message}`); }
  }
  built = null;
  drawFonts();
  replan();
}
$("files").addEventListener("change", (e) => { addFiles([...e.target.files]); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles([...e.dataTransfer.files]); });

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => e.append(k));
  return e;
}
function drawFonts() {
  const box = $("fonts");
  box.textContent = "";
  fonts.forEach((f, fi) => {
    const on = f.presets.filter((p) => p.on).length;
    const tool = (key, fn, dis = false) => { const b = el("button", { className: "quiet", textContent: t(key), disabled: dis || busy }); b.addEventListener("click", fn); return b; };
    const all = (v) => async () => { f.presets.forEach((p, i) => { p.on = v; cv.select(fi, i, v); }); built = null; drawFonts(); replan(); };
    const move = (d) => async () => { const j = fi + d; [fonts[fi], fonts[j]] = [fonts[j], fonts[fi]]; await reload(); built = null; drawFonts(); replan(); };
    const remove = async () => { fonts.splice(fi, 1); await reload(); built = null; drawFonts(); replan(); };
    const ul = el("ul");
    f.presets.forEach((p, pi) => {
      const cb = el("input", { type: "checkbox", checked: p.on, disabled: busy });
      cb.addEventListener("change", () => { p.on = cb.checked; cv.select(fi, pi, p.on); built = null; sum.textContent = summary(); replan(); });
      ul.append(el("li", {}, el("label", {}, cb,
        el("span", { className: "bp", textContent: `${p.bank === 128 ? "kit" : String(p.bank).padStart(3, "0")}:${String(p.prog).padStart(3, "0")}` }),
        el("span", { className: "pn", textContent: p.name }), el("span", { className: "kb", textContent: kb(p.bytes) }))));
    });
    const summary = () => `${f.presets.filter((p) => p.on).length} / ${f.presets.length} ${t("presets")} ${t("chosen")}`;
    const sum = el("summary", { textContent: summary() });
    box.append(el("section", { className: "font" },
      el("div", { className: "top" }, el("span", { className: "num", textContent: `${t("bank")} ${fi}` }), el("span", { className: "nm", textContent: f.name }),
        el("span", { className: "small", textContent: `${f.presets.length} ${t("presets")}, ${mb(f.file.size)}` }),
        el("span", { className: "tools" }, tool("all", all(true)), tool("none", all(false)), tool("up", move(-1), fi === 0),
          tool("down", move(1), fi === fonts.length - 1), tool("remove", remove))),
      el("details", { open: fonts.length === 1 && f.presets.length <= 40 || on < f.presets.length }, sum, ul)));
  });
  $("meter").hidden = $("make").hidden = !fonts.length;
}

let plan = null;
function replan() {
  if (!cv || !info || !fonts.length) { plan = null; return; }
  const total = info.room + ROOM_B, any = fonts.some((f) => f.presets.some((p) => p.on));
  plan = any ? cv.plan(info.room, ROOM_B) : null;
  $("cut").style.left = `${(100 * info.room / total).toFixed(2)}%`;
  const fill = $("fill"), fit = $("fit");
  if (!plan) {
    fill.style.width = "0";
    fit.textContent = t("nothing"); fit.className = "";
    $("quality").textContent = "";
  } else if (!plan.ok) {
    fill.style.width = "100%"; fill.className = "fill over";
    fit.textContent = t("over") + (plan.over ? kb(plan.over) : "") + t("overend"); fit.className = "bad";
    $("quality").textContent = plan.error;
  } else {
    fill.style.width = `${Math.min(100, 100 * plan.planned / total).toFixed(2)}%`; fill.className = "fill";
    fit.textContent = t("fits") + kb(plan.planned) + t("of") + kb(total); fit.className = "";
    $("quality").textContent = t("qual") + plan.levels.map((n, l) => (n ? `${n} ${t("samples")} ${LEVELS[l]}` : "")).filter(Boolean).join(" · ");
  }
  $("barbox").setAttribute("aria-label", fit.textContent);
  $("convert").disabled = busy || !plan || !plan.ok;
  $("after").hidden = !built;
}

// ---- convert
$("convert").addEventListener("click", async () => {
  if (!plan || !plan.ok || busy) return;
  busy = true; drawFonts(); replan();
  const name = ($("name").value.trim() || "My sounds").slice(0, 31);
  try {
    sayK("converting");
    const t0 = performance.now();
    replan();                                       // (the plan the build follows: the one shown)
    built = await cv.build(name, (f) => { $("bar").value = 100 * f; });
    built.name = name;
    const r = built.report;
    log(`${name}: ${r.presets} presets, region A ${r.a} B, region B ${r.b} B, ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    sayK("converted", `${r.presets} ${t("presets")}, ${kb(r.a + r.b)}.` + t("ready"));
  } catch (e) { built = null; sayK("error", e.message); }
  busy = false; drawFonts(); replan();
});

// ---- try: the bank kept for the emulator (IndexedDB, this site's), the emulator opened
function keep(bank) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("rom1", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("bank");
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const tx = rq.result.transaction("bank", "readwrite");
      tx.objectStore("bank").put({ name: bank.name, a: bank.a, b: bank.b, when: Date.now() }, "yours");
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    };
  });
}
$("try").addEventListener("click", async () => {
  if (!built) return;
  try { await keep(built); window.open("../emu/#yours", "_blank"); sayK("tryok"); }
  catch (e) { sayK("trynot"); log(String(e)); }
});

// ---- put: the firmware with region A installed, then region B written and checked
let writing = false;
window.addEventListener("beforeunload", (e) => { if (writing) { e.preventDefault(); e.returnValue = t("leave"); } });
$("put").addEventListener("click", async () => {
  if (!built || busy) return;
  if (!navigator.requestMIDIAccess) { sayK("nomidi"); return; }
  let midi;
  try { midi = await navigator.requestMIDIAccess({ sysex: true }); } catch (e) { sayK("denied"); return; }
  busy = writing = true; drawFonts(); replan();
  $("put").disabled = $("try").disabled = true;
  try {
    const patched = rom1pkg.patch(pkg, built.a);
    const image = logicalImage(patched), product = productOf(patched);
    const up = new Updater(midi, log);
    const total = 74 + 1167, share = built.b.length ? 0.85 : 1;
    const step = (k, a) => {
      log(`${k} ${a ?? ""}`);
      if (k === "start") sayK("start");
      if (k === "verify") { sayK("verify"); $("bar").value = share * 100 * a / total; }
      if (k === "loader") sayK("loader");
      if (k === "write") { sayK("write"); $("bar").value = share * 100 * (74 + a) / total; }
      if (k === "reboot") sayK("reboot");
    };
    const ota = await up.find((id) => /^ota-/i.test(id.model));
    if (ota) { ota.link.close(); if (!(await up.resume(image, step))) throw Object.assign(new Error("stopped"), { code: "stopped" }); }
    else await up.install(image, product, step);
    if (built.b.length) {
      sayK("sendb");
      const dev = await up.waitFor((id) => id.text === product, 20000);
      if (!dev) throw Object.assign(new Error("noreturn"), { code: "noreturn" });
      try {
        const st = await rom1dev.status(dev.link);
        log(`status: ${JSON.stringify(st)}`);
        const ok = await rom1dev.sendB(dev.link, built.b, built.id, (f) => { $("bar").value = 100 * (share + (1 - share) * f); });
        sayK(ok ? "done" : "doneb");
      } finally { dev.link.close(); }
    } else sayK("done");
    $("bar").value = 100;
  } catch (e) {
    if (e && e.code && TEXT[lang][e.code]) sayK(e.code, e.detail || "");
    else sayK("error", e && e.message);
    log(String(e && e.stack || e));
  }
  busy = writing = false; drawFonts(); replan();
  $("put").disabled = $("try").disabled = false;
});

// ---- start: the release's package (where region A goes, and its room), the converter
const started = (async () => {
  applyLang();
  try {
    const [r, w] = await Promise.all([fetch(meta.pkg), fetch("rom1conv.wasm")]);
    if (!r.ok) throw new Error(`${meta.pkg}: HTTP ${r.status}`);
    if (!w.ok) throw new Error(`rom1conv.wasm: HTTP ${w.status}`);
    pkg = new Uint8Array(await r.arrayBuffer());
    if (productOf(pkg) !== meta.product) throw new Error("the package is not the one this page was made for");
    info = rom1pkg.info(pkg);
    cv = await rom1Converter(await w.arrayBuffer());
    say(`ROM-1 ${meta.version}`);
    log(`ROM-1 ${meta.version}: room ${info.room} B in the firmware, ${ROOM_B} B in the data area`);
    return true;
  } catch (e) { sayK("loadfail", e.message); return false; }
})();
</script>
